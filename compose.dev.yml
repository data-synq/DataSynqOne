# Development overlay: `docker compose -f compose.yml -f compose.dev.yml ...`
# (see the Makefile). In dev only the infrastructure runs in containers; backend
# and frontend run natively on the host, so vectordb needs a published port.
#
# Deliberately NOT named compose.override.yml — Compose would then load it for
# `make up` as well.
services:
  vectordb:
    ports:
      # 5433 to stay clear of a Postgres that may already own 5432 on the host.
      - "5433:5432"
