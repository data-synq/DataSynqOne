services:
  redis:
    image: docker.io/library/redis:latest
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  postgres:
    image: docker.io/library/postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - env/postgres.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  vectordb:
    image: docker.io/pgvector/pgvector:pg16
    container_name: vectordb
    restart: unless-stopped
    env_file:
      - env/vectordb.env
    volumes:
      - ./data/vectordb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Wandelt eingehende .eml-Mails in PDFs, damit Paperless sie im Browser
  # rendern kann (EML kann das kein Browser nativ). Reiner Konverter, kein
  # eigener Zustand, keine Ports nach außen — nur im Compose-Netz erreichbar.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    # Der Inhalt kommt aus fremden E-Mails: das interne Chromium soll weder
    # Skripte ausführen noch Tracking-Pixel oder Remote-Content nachladen.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  # Extrahiert Text aus dem HTML-Teil einer Mail (und, mit PAPERLESS_TIKA_ENABLED,
  # aus Office-Dokumenten) für die Volltextsuche.
  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - gotenberg
      - tika
    ports:
      - "80:8000"
    volumes:
      - ./data/paperless/data:/usr/src/paperless/data
      - ./data/paperless/media:/usr/src/paperless/media
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/consume:/usr/src/paperless/consume
    env_file:
      - env/paperless.env
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start (migrations, index load) takes ~2 min; without this the boot-time
      # failures count against `retries` and backend's service_healthy gate gives up.
      start_period: 240s

  backend:
    build: ./server
    container_name: backend
    restart: unless-stopped
    depends_on:
      paperless:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    env_file:
      - env/backend.env
    ports:
      - "8001:8000"

  frontend:
    build: ./src
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
