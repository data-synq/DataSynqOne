name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          fi
      - name: Install locked dependencies
        run: |
          python3 -m venv server/.venv
          server/.venv/bin/python -m pip install --require-hashes -r server/requirements-dev.txt
          npm --prefix src ci
      - name: Test and audit
        run: |
          make check
          server/.venv/bin/python -m pip check
          server/.venv/bin/pip-audit --requirement server/requirements.txt --disable-pip
          npm --prefix src audit --omit=dev --audit-level=high
      - name: Verify generated locks are current
        shell: bash
        run: |
          cp server/requirements.txt /tmp/requirements.txt
          cp server/requirements-dev.txt /tmp/requirements-dev.txt
          (cd server && .venv/bin/uv pip compile --generate-hashes --output-file /tmp/requirements.txt requirements.in)
          (cd server && .venv/bin/uv pip compile --generate-hashes --output-file /tmp/requirements-dev.txt requirements-dev.in)
          diff -u <(sed '1,2d' server/requirements.txt) <(sed '1,2d' /tmp/requirements.txt)
          diff -u <(sed '1,2d' server/requirements-dev.txt) <(sed '1,2d' /tmp/requirements-dev.txt)
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  backend:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/data-synq/datasynqone-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          load: true
          provenance: false
          sbom: false
          tags: datasynqone-backend:security-scan
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: datasynqone-backend:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/data-synq/datasynqone-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  frontend:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/data-synq/datasynqone-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./src
          build-args: VITE_BACKEND_URL=/api
          load: true
          provenance: false
          sbom: false
          tags: datasynqone-frontend:security-scan
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: datasynqone-frontend:security-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ./src
          build-args: VITE_BACKEND_URL=/api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/data-synq/datasynqone-frontend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

# Production deployment intentionally is not automated here. Copy the two immutable
# job digests into a reviewed DataSynqInfra pull request after verifying the OCI
# provenance/SBOM. No cross-repository write credential is available to this workflow.
